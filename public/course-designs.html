<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course viewer · Three design options</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#1b2939;font-family:system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #7eb9ad;outline-offset:3px}.chooser{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 24px;background:#192638;color:white}.chooser small{display:block;color:#b3c0d2;margin-top:5px;font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{padding:10px 14px;background:#304055;border-radius:8px;color:#dfe7f0;font-size:12px}.tabs button[aria-pressed=true]{background:white;color:#182638}.note{padding:12px 24px;background:#e8eff6;color:#596d85;font-size:12px}.app{display:grid;grid-template-columns:190px 1fr;min-height:calc(100vh - 120px)}.appnav{padding:28px 18px;background:white;border-right:1px solid #e3e8ee;display:flex;flex-direction:column;gap:8px}.logo{font-size:20px;font-weight:800;padding:0 12px;margin-bottom:32px}.logo span{color:#178174}.navlink{padding:12px;font-size:13px;color:#7a8798;border-radius:8px}.navlink.active{background:#eaf5f1;color:#187a6b;font-weight:650}.account{margin-top:auto;padding:20px 12px;font-size:12px;color:#7b8798}.design{display:none}.design.active{display:block}.workspace{padding:28px;max-width:1500px;margin:auto}.crumb{font-size:12px;color:#8894a5;margin-bottom:24px}.header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}.eyebrow{font-size:10px;font-weight:750;letter-spacing:1.5px;text-transform:uppercase;color:#7e8e9f}h1{font-size:27px;letter-spacing:-.6px;margin:7px 0 8px}h2{font-size:16px;margin:0}p{font-size:13px;line-height:1.7;color:#7a8798;margin:8px 0}.btn{padding:11px 16px;border-radius:8px;color:white;background:#137e70;font-size:12px;font-weight:650;display:inline-flex;align-items:center;gap:8px}.btn.secondary{background:white;color:#617387;border:1px solid #e0e6ee}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}.card{background:white;border:1px solid #e1e7ee;border-radius:14px;overflow:hidden}.courseinfo{padding:21px;border-bottom:1px solid #e8edf2}.courseinfo p{font-size:11px}.search{padding:14px}.search input{width:100%;padding:10px 12px;background:#f5f7fa;border:1px solid #e8edf2;border-radius:8px;font-size:12px;color:#546579}.lessons{padding:0 10px 12px}.lesson{display:flex;align-items:center;text-align:start;gap:10px;width:100%;padding:13px 10px;margin-bottom:5px;border-radius:9px;background:transparent;color:#617085;font-size:12px;line-height:1.5}.lesson .number{display:grid;place-items:center;flex-shrink:0;width:28px;height:28px;background:#f3f5f8;border-radius:7px;font-size:10px}.lesson.selected{color:#15796d;background:#eaf5f1;font-weight:650;border:1px solid #c2dfd6}.lesson.selected .number{background:#1b8272;color:white}.lesson small{display:block;color:#92a0b0;font-size:10px;margin-top:3px}.lesson.done .number{color:#1b8272}.coursefoot{padding:15px;border-top:1px solid #e8edf2;display:flex;gap:8px;align-items:center;justify-content:space-between}.coursefoot a{font-size:11px;color:#668076}.player{aspect-ratio:16/9;border-radius:14px;background:radial-gradient(ellipse at 80% 20%,#26595a,transparent 60%),linear-gradient(135deg,#162731,#12252b);position:relative;overflow:hidden;display:grid;place-items:center;box-shadow:0 12px 24px #1b293916}.player-art{width:70%;height:65%;position:absolute;transform:rotate(-5deg);border:1px solid #ffffff18;border-radius:12px;background:#ffffff06;display:grid;grid-template-columns:28% 1fr;padding:15px;gap:15px}.artnav{border-radius:6px;background:#ffffff08}.artbody{display:flex;flex-direction:column;gap:12px;padding-top:12px}.artline{height:8px;background:#ffffff16;border-radius:4px;width:70%}.artchart{height:70%;background:linear-gradient(155deg,#60b7a72b,#ffffff03);border:1px solid #ffffff10;border-radius:6px}.play{position:relative;display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:#ffffffee;color:#187366;font-size:24px;box-shadow:0 5px 30px #0003}.controls{position:absolute;bottom:0;left:0;right:0;padding:16px 20px;background:linear-gradient(transparent,#0009);color:#ffffffb8;font-size:11px}.track{height:3px;background:#ffffff30;margin-bottom:10px;border-radius:4px}.track span{display:block;width:24%;height:100%;background:#7ad4bb}.controlrow{display:flex;justify-content:space-between}.lessonhead{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:22px 0}.lessonhead h2{font-size:22px;letter-spacing:-.3px}.lessonhead p{font-size:12px}.chapters{padding:20px}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:1px solid #e8edf2;margin-bottom:8px}.cardhead small{color:#8b97a6;font-size:11px}.chapter{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #f0f3f7}.chapter:last-of-type{border:0}.chapter-thumb{width:70px;height:42px;flex-shrink:0;background:linear-gradient(145deg,#233e4d,#407f77);border-radius:7px;display:grid;place-items:center;color:#c3e9de;font-size:12px}.chapter strong{font-size:12px;display:block}.chapter small{font-size:10px;color:#8897a8;display:block;margin-top:4px}.chapter time{font-size:11px;color:#188171;margin-inline-start:auto;border-radius:6px;padding:5px;background:#edf7f3;font-variant-numeric:tabular-nums}.chapteradd{width:100%;margin-top:16px;justify-content:center;background:#eef7f3;color:#1c8071;border:1px dashed #badbcf}.caption{font-size:11px;color:#96a2b2;margin-top:16px}.mobile-title{display:none}
/* 02: video first, editorial horizontal chapters */
.cinema{background:#fbfaf7}.cinema .workspace{max-width:1160px;padding:32px 40px}.cinema h1{font-family:Georgia,serif;font-weight:500;font-size:32px}.cinema .player{aspect-ratio:21/9;border-radius:8px}.cinema .layout{grid-template-columns:minmax(0,1fr) 300px;margin-top:24px}.cinema .chapters{border-radius:8px}.cinema .card{border-color:#e7e2d8}.cinema .cardhead{border-color:#e7e2d8}.cinema .chapter-thumb{width:80px;height:48px}.cinema .btn{border-radius:5px;background:#344c43}.cinema .btn.secondary{background:white;color:#344c43}.cinema .lesson.selected{background:#f1f0e8;color:#344c43;border-color:#d9d9c8}.cinema .coursefoot{flex-wrap:wrap}.cinema .lessonhead{margin:0 0 22px}.cinema .lessonhead h2{font-family:Georgia,serif;font-size:26px;font-weight:500}
/* 03: focused dark learning console */
.focus{background:#111a26;color:#e2eaf5}.focus .workspace{padding:28px}.focus .card{background:#1a2636;border-color:#2c3a4c}.focus .layout{grid-template-columns:minmax(0,1fr) 290px}.focus .courseinfo,.focus .coursefoot,.focus .cardhead{border-color:#304054}.focus p,.focus .eyebrow{color:#91a2b7}.focus .lesson{color:#a8b8ca}.focus .lesson .number{background:#26364a;color:#97aabd}.focus .lesson.selected{background:#203f3d;border-color:#396158;color:#a4e3d0}.focus .lesson.selected .number{background:#78cbb4;color:#12372e}.focus .search input{background:#132030;border-color:#2d3c50;color:#cfdae8}.focus .btn{background:#9edecb;color:#1b3c32}.focus .btn.secondary{background:#243449;color:#a6bacf;border-color:#3c4c62}.focus .player{background:radial-gradient(ellipse at top right,#22464c,transparent 65%),#0b121c}.focus .chapters{margin-top:22px}.focus .chapter{border-color:#29394b}.focus .chapter time{background:#213f3b;color:#9fe0c9}.focus .lessonhead h2{font-size:24px}.focus .coursefoot{display:block}.focus .coursefoot .btn{width:100%;justify-content:center;margin-top:12px}.focus .chapteradd{background:#213d37;color:#b2e7d9}.focus .player-art{border-color:#ffffff15}
@media(max-width:1100px){.app{grid-template-columns:160px 1fr}.layout,.focus .layout{grid-template-columns:230px minmax(0,1fr)}.focus .layout>div:first-child{grid-column:1/-1}.focus .layout>aside{grid-column:1/-1}.cinema .layout{grid-template-columns:1fr}.workspace,.cinema .workspace{padding:24px}.header{flex-wrap:wrap}.chooser{align-items:flex-start;flex-direction:column}}
@media(max-width:760px){.app{display:block}.appnav{display:none}.layout,.focus .layout{display:flex;flex-direction:column}.layout>*{width:100%}.layout>aside{order:2}.workspace,.cinema .workspace,.focus .workspace{padding:20px 16px}.chooser{padding:16px}.note{padding:12px 16px}.lessonhead{flex-wrap:wrap}.cinema .player{aspect-ratio:16/9}.player-art{padding:8px;gap:8px}.header h1{font-size:25px}.courseinfo{padding:16px}}
@media(prefers-reduced-motion:no-preference){.design.active{animation:appear .25s ease-out}.lesson,.btn{transition:background .18s,transform .18s}.btn:hover{transform:translateY(-1px)}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}}
</style>
</head><body>
<header class="chooser"><div><strong>Choose your course page design</strong><small>Three visual concepts · sample lessons and chapters · preview only</small></div><nav class="tabs" aria-label="Design options"><button data-design="clean" aria-pressed="true">01 · Learning workspace</button><button data-design="cinema" aria-pressed="false">02 · Cinema classroom</button><button data-design="focus" aria-pressed="false">03 · Focus studio</button></nav></header>
<div class="note" id="design-note">01 — A light workspace with a compact module list and a generous video player.</div>
<div class="app"><aside class="appnav"><div class="logo"><span>◈</span> Support</div><a class="navlink" href="/ticket">▧ &nbsp; Tickets</a><a class="navlink active" href="/training">◇ &nbsp; Training Center</a><div class="account">JD &nbsp; Jordan Davis<br><small>Sample account</small></div></aside><div id="design-panels"></div></div>
<template id="player-template"><div class="player" aria-label="Sample video player"><div class="player-art" aria-hidden="true"><div class="artnav"></div><div class="artbody"><div class="artline"></div><div class="artline" style="width:45%"></div><div class="artchart"></div></div></div><button type="button" class="play" aria-label="Preview player">▶</button><div class="controls" aria-hidden="true"><div class="track"><span></span></div><div class="controlrow"><span>▶ &nbsp; 04:32 / 18:45</span><span>Volume &nbsp; ⛶</span></div></div></div></template>
<template id="modules-template"><aside class="card"><div class="courseinfo"><div class="eyebrow">Course content</div><h2 style="margin-top:8px">Getting started with the system</h2><p>6 modules · Sample course</p></div><div class="search"><input type="search" placeholder="Search modules…" aria-label="Search sample modules"></div><div class="lessons"><button class="lesson done"><span class="number">✓</span><span>A quick tour of the system<small>Module 01 · 08:20</small></span></button><button class="lesson selected" aria-current="true"><span class="number">02</span><span>Accounting reports<small>Current lesson · 18:45</small></span></button><button class="lesson"><span class="number">03</span><span>Managing shipment records<small>Module 03 · 12:10</small></span></button><button class="lesson"><span class="number">04</span><span>Inventory and warehouses<small>Module 04 · 16:05</small></span></button><button class="lesson"><span class="number">05</span><span>Customer accounts<small>Module 05 · 10:30</small></span></button><button class="lesson"><span class="number">06</span><span>Monthly summaries<small>Module 06 · 14:15</small></span></button></div><div class="coursefoot"><a href="/training/1/edit">Edit course ↗</a><button type="button" class="btn" data-preview-action>Add module +</button></div></aside></template>
<template id="chapters-template"><section class="card chapters"><div class="cardhead"><h2>Video chapters</h2><small>3 key moments</small></div><div class="chapter"><span class="chapter-thumb" aria-hidden="true">▶</span><div><strong>Understanding the reports dashboard</strong><small>Introduction and navigation</small></div><time>00:00</time></div><div class="chapter"><span class="chapter-thumb" aria-hidden="true">▶</span><div><strong>Choosing a date range</strong><small>Filter reports for a specific period</small></div><time>04:32</time></div><div class="chapter"><span class="chapter-thumb" aria-hidden="true">▶</span><div><strong>Exporting your results</strong><small>Download and share your reports</small></div><time>12:18</time></div><button type="button" class="btn chapteradd" data-preview-action>+ Add chapter</button></section></template>
<script>
const panels=document.getElementById('design-panels');
const piece=id=>document.getElementById(id+'-template').innerHTML;
const heading='<div class="crumb"><a href="/training">Courses</a> &nbsp; / &nbsp; Getting started</div><header class="header"><div><div class="eyebrow">Training center · Module 02 of 06</div><h1>Accounting reports</h1><p>Learn how to find, filter, and export your financial reports.</p></div><button class="btn secondary" type="button" data-preview-action>Next lesson →</button></header>';
const lessonHead='<div class="lessonhead"><div><h2>Accounting reports</h2><p>Module 02 &nbsp; · &nbsp; 18 minutes</p></div><button class="btn secondary" type="button" data-preview-action>Edit course ↗</button></div>';
for(const id of ['clean','cinema','focus']){const section=document.createElement('section');section.id=id;section.className='design '+id+(id==='clean'?' active':'');let content;if(id==='clean')content=heading+'<div class="layout">'+piece('modules')+'<div>'+piece('player')+lessonHead+piece('chapters')+'</div></div>';if(id==='cinema')content=heading+piece('player')+'<div class="layout"><div>'+lessonHead+piece('chapters')+'</div>'+piece('modules')+'</div>';if(id==='focus')content=heading+'<div class="layout"><div>'+piece('player')+lessonHead+piece('chapters')+'</div>'+piece('modules')+'</div>';section.innerHTML='<main class="workspace">'+content+'<p class="caption">Visual prototype — no live course data or video playback.</p></main>';panels.append(section);}
const notes={clean:'01 — A light workspace with a compact module list and a generous video player.',cinema:'02 — A wide video stage above a warm classroom layout with chapters and course navigation.',focus:'03 — A dark learning studio with the lesson in focus and course content on the right.'};
document.querySelectorAll('[data-design]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-design]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));document.querySelectorAll('.design').forEach(panel=>panel.classList.toggle('active',panel.id===button.dataset.design));document.getElementById('design-note').textContent=notes[button.dataset.design];}));
document.querySelectorAll('.search input').forEach(input=>input.addEventListener('input',()=>{input.closest('aside').querySelectorAll('.lesson').forEach(lesson=>lesson.hidden=!lesson.textContent.toLowerCase().includes(input.value.toLowerCase()));}));
document.querySelectorAll('.lesson').forEach(button=>button.addEventListener('click',()=>{button.closest('.lessons').querySelectorAll('.lesson').forEach(item=>{item.classList.toggle('selected',item===button);if(item===button)item.setAttribute('aria-current','true');else item.removeAttribute('aria-current');});}));
document.querySelectorAll('[data-preview-action],.play').forEach(button=>button.addEventListener('click',()=>{document.getElementById('design-note').textContent='Preview only. Choose design 01, 02, or 03 in the chat to apply it to the live course page.';}));
</script></body></html>
